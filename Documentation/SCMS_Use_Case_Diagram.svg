<rect class="note" x="545" y="625" width="210" height="270" rx="3"/>
<text class="note-h" x="557" y="647.0" xml:space="preserve">Rules from the SRS</text>
<text class="note-t" x="557" y="662.5" xml:space="preserve"></text>
<text class="note-t" x="557" y="678.0" xml:space="preserve">• Every role is a Registered</text>
<text class="note-t" x="557" y="693.5" xml:space="preserve">  User and inherits its use cases.</text>
<text class="note-t" x="557" y="709.0" xml:space="preserve"></text>
<text class="note-t" x="557" y="724.5" xml:space="preserve">• A complaint can be closed only</text>
<text class="note-t" x="557" y="740.0" xml:space="preserve">  once resolved with resolution</text>
<text class="note-t" x="557" y="755.5" xml:space="preserve">  details recorded (FR-020).</text>
<text class="note-t" x="557" y="771.0" xml:space="preserve"></text>
<text class="note-t" x="557" y="786.5" xml:space="preserve">• Feedback is allowed only after</text>
<text class="note-t" x="557" y="802.0" xml:space="preserve">  resolution (FR-021).</text>
<text class="note-t" x="557" y="817.5" xml:space="preserve"></text>
<text class="note-t" x="557" y="833.0" xml:space="preserve">• Staff may only update status</text>
<text class="note-t" x="557" y="848.5" xml:space="preserve">  through permitted states and</text>
<text class="note-t" x="557" y="864.0" xml:space="preserve">  only for complaints assigned</text>
<text class="note-t" x="557" y="879.5" xml:space="preserve">  to them (FR-012, FR-013).</text>
</svg>