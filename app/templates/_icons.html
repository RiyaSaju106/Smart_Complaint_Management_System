{# Inline icons (Feather-style, MIT). Usage: {% from "_icons.html" import icon %}{{ icon("mail") }} #}
{% macro icon(name, size=20) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == "mail" -%}<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>
{%- elif name == "lock" -%}<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>
{%- elif name == "eye" -%}<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>
{%- elif name == "user" -%}<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
{%- elif name == "phone" -%}<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>
{%- elif name == "home" -%}<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>
{%- elif name == "logo" -%}<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>
{%- elif name == "doc-plus" -%}<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 11v6M9 14h6"/>
{%- elif name == "search" -%}<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
{%- elif name == "list" -%}<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/>
{%- elif name == "arrow" -%}<path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif name == "check" -%}<path d="M20 6L9 17l-5-5"/>
{%- endif -%}
</svg>
{%- endmacro %}
