<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SCMS{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f6f8; color: #222; }
    header { padding: 16px 24px; color: #fff; display: flex; justify-content: space-between; align-items: center; }
    header.resident { background: #2f6fb3; }
    header.staff { background: #357a38; }
    header.admin { background: #8a2b2b; }
    .badge { background: rgba(255,255,255,.2); padding: 4px 10px; border-radius: 12px; font-size: 14px; }
    main { padding: 24px; max-width: 800px; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 16px; margin-bottom: 12px; }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
